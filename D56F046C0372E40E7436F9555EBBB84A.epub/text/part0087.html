<p class="p"><img alt="img2.jpg" src="../images/00013.jpeg" class="calibre4"/></p>
<p class="p15a">C<span class="t6">IXIN</span> L<span class="t6">IU</span> is the People’s Republic of China’s leading Science Fiction writer. He has won the China Galaxy Science Fiction Award nine times and the Nebula (Xingyun) award twice. Before becoming a writer, he was a computer engineer in a power plant in Yangquan.</p>
